<html>
  <head>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <!-- <link href="index.css" rel="stylesheet"> -->
     <style>
        :root {
        --bg-color: #fff;
        --text-color: #000;
        --bit-off-bg: #fff;
        --bit-off-color: #000;
        --bit-off-border: #000;
        --bit-on-bg: #000;
        --bit-on-color: #fff;
        --bit-on-border: #fff;
        --button-bg: #f0f0f0;
        --button-color: #000;
        --button-border: #888;
        }

        body.dark {
        --bg-color: #121212;
        --text-color: #eee;
        --bit-off-bg: #2b2b2b;
        --bit-off-color: #eee;
        --bit-off-border: #eee;
        --bit-on-bg: #eee;
        --bit-on-color: #121212;
        --bit-on-border: #121212;
        --button-bg: #2b2b2b;
        --button-color: #eee;
        --button-border: #666;
        }

        body {
        font-family: 'Ubuntu', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        transition: background-color 0.2s, color 0.2s;
        }

        button {
        font-family: 'Ubuntu', sans-serif;
        background-color: var(--button-bg);
        color: var(--button-color);
        border: 1px solid var(--button-border);
        border-radius: 4px;
        padding: 8px 12px;
        cursor: pointer;
        }

        .container {
        margin: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        }

        .buttonRow {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
        }

        table {
        margin-left: 0;

        }

        table, td, th{
        font-family: 'Ubuntu', sans-serif;
        font-size: 50px;
        text-align: center;
        border: 1px solid var(--text-color);
        border-collapse: collapse;
        color: var(--text-color);
        }

        td, th {
        padding: 30px;
        }

        .bit {
        color: var(--bit-off-color);
        background-color: var(--bit-off-bg);
        border: var(--bit-off-border) dotted;
        cursor: pointer;
        }

        .bit.on {
        color: var(--bit-on-color);
        background-color: var(--bit-on-bg);
        border: var(--bit-on-border) dotted;
        }

        .help, #directions {
        margin-top: 20px;
        margin-left: 10px;
        
        }

        #directions {
        margin-right: 20px;
        padding:20px;
        background-color: #EFC2FF;
        border-radius: 5px;
        }


        @media 
        only screen and (max-width: 760px),
        (min-device-width: 500px) and (max-device-width: 1024px)  {

            /* Force table to not be like tables anymore */
        
            table, td, th{
            font-family: 'Ubuntu', sans-serif;
            font-size: 24px;
            padding: 5px;
            text-align: center;
            border: 1px solid black;
            border-collapse: collapse; 
            }
        }
     </style>
  </head>
  <body>
    <div class="container">
        <h1>Number Conversions</h1>
        <div class="buttonRow">
            <button id="combinedBtn">Toggle Base 2/Base 16 &amp; Split Tables</button>
            <button id="resetBtn">Reset</button>
            <button id="darkModeBtn">Dark Mode</button>
        </div>
        <table id="combinedTable">
        <tr id="row1"> <!-- powers-->
            <th id="head1">2<sup>7</sup></th>
            <th id="head2">2<sup>6</sup></th>
            <th id="head3">2<sup>5</sup></th>
            <th id="head4">2<sup>4</sup></th>
            <th>2<sup>3</sup></th>
            <th>2<sup>2</sup></th>
            <th>2<sup>1</sup></th>
            <th>2<sup>0</sup></th>

        </tr>
        <tr id="row2"> <!-- values-->
            <td>128</td>
            <td>64</td>
            <td>32</td>
            <td>16</td>
            <td>8</td>
            <td>4</td>
            <td>2</td>
            <td>1</td>
        </tr>
        <tr id="row3"> <!-- bits-->
            <td class="bit" id="128">0</td>
            <td class="bit" id="64">0</td>
            <td class="bit" id="32">0</td>
            <td class="bit" id="16">0</td>
            <td class="bit" id="8">0</td>
            <td class="bit" id="4">0</td>
            <td class="bit" id="2">0</td>
            <td class="bit" id="1">0</td>
        </tr>
        </table>
        <div id="splitTables" style="display:none; gap: 20px;">
            <table id="leftTable">
                <tr id="leftRow1"></tr>
                <tr id="leftRow2"></tr>
                <tr id="leftRow3"></tr>
            </table>
            <table id="rightTable">
                <tr id="rightRow1"></tr>
                <tr id="rightRow2"></tr>
                <tr id="rightRow3"></tr>
            </table>
        </div>
    </div>
  </body>
  <script>
    $(document).on("click", ".bit", function() {
        var $bit = $(this).toggleClass("on");
        $bit.text($bit.hasClass("on") ? "1" : "0");
    });

    var originalHeaders = ["2<sup>7</sup>", "2<sup>6</sup>", "2<sup>5</sup>", "2<sup>4</sup>"];
    var altHeaders = ["2<sup>3</sup>", "2<sup>2</sup>", "2<sup>1</sup>", "2<sup>0</sup>"];
    var $headers = [$("#head1"), $("#head2"), $("#head3"), $("#head4")];
    var $combinedTable = $("#combinedTable");
    var $splitTables = $("#splitTables");
    var showingAlt = false;
    var isSplit = false;
    var storedLeftCells = {};

    $("#combinedBtn").click(function() {
        var headers = showingAlt ? originalHeaders : altHeaders;
        $headers.forEach(function($h, i) { $h.html(headers[i]); });
        showingAlt = !showingAlt;

        if (!isSplit) {
            for (var i = 1; i <= 3; i++) {
                var cells = $("#row" + i).children();
                var leftCells = cells.slice(0, 4);
                cells.slice(4, 8).appendTo("#rightRow" + i);

                if (i === 3) {
                    // bit row: keep the real cells so toggled values are preserved, not mirrored
                    leftCells.appendTo("#leftRow" + i);
                } else {
                    storedLeftCells[i] = leftCells.detach();
                    $("#leftRow" + i).html($("#rightRow" + i).html());
                }
            }
            $combinedTable.hide();
            $splitTables.css("display", "flex");
        } else {
            for (var i = 1; i <= 3; i++) {
                $("#rightRow" + i).children().appendTo("#row" + i);

                if (i === 3) {
                    $("#leftRow" + i).children().prependTo("#row" + i);
                } else {
                    storedLeftCells[i].prependTo("#row" + i);
                    $("#leftRow" + i).empty();
                }
            }
            $splitTables.hide();
            $combinedTable.show();
        }
        isSplit = !isSplit;
    });

    $("#resetBtn").click(function() {
        $(".bit").removeClass("on").text("0");
    });

    var $body = $("body");
    var $darkModeBtn = $("#darkModeBtn");

    function applyDarkMode(isDark) {
        $body.toggleClass("dark", isDark);
        $darkModeBtn.text(isDark ? "Light Mode" : "Dark Mode");
    }

    applyDarkMode(localStorage.getItem("darkMode") === "true");

    $darkModeBtn.click(function() {
        var isDark = !$body.hasClass("dark");
        applyDarkMode(isDark);
        localStorage.setItem("darkMode", isDark);
    });
  </script>

</html>
